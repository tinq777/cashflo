<!doctype html>
<html lang="en-AU">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f6f62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cashflo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first single column; sticky header (brand · pay-period picker · settings), fixed bottom bar with a centre add button; two columns from 860px */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#14201c; --muted:#5a6a64; --line:#d8e1de;
  --accent:#0f6f62; --accent-ink:#ffffff; --accent-soft:#d7ece7;
  --bills:#5b6a8c; --spend:#cf6a3c; --saved:#0f6f62; --left:#c9d6d1;
  --good:#2c7d48; --good-soft:#dcefe2; --warn:#a8650f; --warn-soft:#f6e8d2; --bad:#b4332a; --bad-soft:#f6dcd9; --info:#3d5f8a; --info-soft:#dfe7f2;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 16px rgba(20,32,28,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#162019; --sunk:#111a17; --ink:#e4ece9; --muted:#93a59e; --line:#26342f;
  --accent:#3fbfa5; --accent-ink:#06211b; --accent-soft:#163a33;
  --bills:#8f9fc4; --spend:#ee8a5c; --saved:#3fbfa5; --left:#2b3a35;
  --good:#5cc27f; --good-soft:#173524; --warn:#e2a54a; --warn-soft:#3a2a12; --bad:#ec7b70; --bad-soft:#3d1c19; --info:#8fb2e0; --info-soft:#1c2a3d;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#162019; --sunk:#111a17; --ink:#e4ece9; --muted:#93a59e; --line:#26342f;
  --accent:#3fbfa5; --accent-ink:#06211b; --accent-soft:#163a33;
  --bills:#8f9fc4; --spend:#ee8a5c; --saved:#3fbfa5; --left:#2b3a35;
  --good:#5cc27f; --good-soft:#173524; --warn:#e2a54a; --warn-soft:#3a2a12; --bad:#ec7b70; --bad-soft:#3d1c19; --info:#8fb2e0; --info-soft:#1c2a3d;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem} .pos{color:var(--good)} .neg{color:var(--bad)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;margin-right:auto;border:0;background:none;padding:0}
.period{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding:3px}
.period button{border:0;background:transparent;width:30px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
.period button:disabled{opacity:.28;cursor:default}
.period .pl{display:flex;flex-direction:column;align-items:center;min-width:104px;line-height:1.15}
.period .pl b{font-size:.88rem;font-weight:600;white-space:nowrap}
.period .pl span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn[aria-current="page"],.icon-btn:hover{color:var(--accent);background:var(--sunk)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.cols{grid-template-columns:1.1fr .9fr;align-items:start}.cols>div{display:flex;flex-direction:column;gap:14px;min-width:0}}
.cols>div{display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h .sub{font-size:.82rem;color:var(--muted)}
.banner{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;background:var(--info-soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.banner b{color:var(--info)} .banner .grow{flex:1;min-width:200px}
.banner.warn{background:var(--warn-soft)} .banner.warn b{color:var(--warn)}

/* hero */
.hero .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font-family:var(--font-num);font-size:2.3rem;font-weight:500;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.split{display:flex;height:18px;border-radius:7px;overflow:hidden;gap:2px;background:var(--sunk)}
.split i{display:block;height:100%;min-width:3px}
.sw-bills{background:var(--bills)} .sw-spend{background:var(--spend)} .sw-saved{background:var(--saved)} .sw-left{background:var(--left)} .sw-over{background:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
@media (min-width:560px){.keys{grid-template-columns:repeat(4,minmax(0,1fr))}}
.key{display:flex;flex-direction:column;gap:1px;border:0;background:none;text-align:left;padding:8px;border-radius:10px;min-width:0}
button.key:hover{background:var(--sunk)}
.key .k{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:500}
.key .k i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key .v{font-family:var(--font-num);font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem}

/* meters, pills */
.meter{height:8px;background:var(--sunk);border-radius:999px;position:relative;overflow:hidden}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)} .meter.good>i{background:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* checklist */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.step.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.step.done b{color:var(--muted);text-decoration:line-through;font-weight:500}
.step p{font-size:.82rem;color:var(--muted)}

/* ranked rows */
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg label,.seg button{flex:1;text-align:center;position:relative;border:0;background:none;padding:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span,.seg button{display:block;padding:6px 10px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg input:checked+span,.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.rank{display:flex;flex-direction:column;gap:2px}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;background:none;text-align:left;padding:8px;margin:0 -8px;border-radius:10px;width:calc(100% + 16px)}
.rk:hover{background:var(--sunk)}
.rk .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rk .amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rk .bar{grid-column:1;height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:4px}
.rk .vs{text-align:right}
.save-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.save-row:first-child{border-top:0;padding-top:0}
.save-row b{font-weight:600}
.save-row p{grid-column:1;color:var(--muted);font-size:.86rem}
.save-row .yr{font-family:var(--font-num);font-size:.85rem;color:var(--good);white-space:nowrap;text-align:right}
.save-row .go{grid-column:1/-1;justify-self:start}

/* AI */
.ai{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ai-head{font-family:var(--font-display);font-size:1.1rem;font-weight:600;text-wrap:balance}
.ai-acts{display:flex;flex-direction:column;gap:0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}

/* chart */
.trend{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:end;height:150px}
.trend .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0;border:0;background:none;padding:0}
.trend .stack{position:relative;display:flex;flex-direction:column-reverse;width:min(30px,70%);height:100%;justify-content:flex-start}
.trend .stack i{display:block;width:100%}
.trend .stack i:first-child{border-radius:0 0 3px 3px}
.trend .stack i:last-of-type{border-radius:3px 3px 0 0}
.trend .inc{position:absolute;left:-5px;right:-5px;height:0;border-top:2px solid var(--ink)}
.trend .m{font-size:.75rem;color:var(--muted)}
.trend .col.sel .m{color:var(--ink);font-weight:700}
.legend{display:flex;gap:6px 14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* activity */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{background:var(--warn);color:#fff;border-radius:999px;padding:0 6px;font-size:.72rem}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:11px 8px;margin:0 -8px;border:0;border-top:1px solid var(--line);align-items:center;background:none;text-align:left;width:calc(100% + 16px);color:inherit;border-radius:0}
.day+.row{border-top:0}
button.row:hover{background:var(--sunk)}
.row .d{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);min-width:0}
.row .amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt.in{color:var(--good)}
.day{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 6px}
.day:first-child{padding-top:0}

/* forms */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,.select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
textarea.input{height:120px;padding:10px 12px;font-family:var(--font-num);font-size:.8rem;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{height:34px;padding:0 11px;font-size:.85rem}
.btn.link{border:0;background:none;color:var(--accent);padding:0;height:auto}
.btn.block{width:100%}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* bills */
.rec{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0;padding-top:0}
.rec .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .mo{font-family:var(--font-num);text-align:right}
.rec .sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.totals .v{font-family:var(--font-num);font-size:1.1rem}

/* goals */
.alloc{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--sunk);gap:2px}
.alloc i{display:block;height:100%;min-width:2px}
.alloc-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.alloc-key span{display:inline-flex;align-items:center;gap:6px}
.alloc-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.buckets{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.buckets{grid-template-columns:1fr 1fr}}
.bk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bk-h .acct{font-size:.8rem;color:var(--muted)}
.bk-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.bk-fields .input{height:38px;padding:0 8px}
.sugg{display:flex;flex-direction:column}
.sg{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.sg:first-child{border-top:0}
.sg input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.sg .ch{font-family:var(--font-num);white-space:nowrap;text-align:right}
.sg p{grid-column:2/-1;font-size:.84rem;color:var(--muted)}

/* settings */
.set-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem;flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row code{font-family:var(--font-num);font-size:.82rem;background:var(--sunk);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
ol.how code{font-family:var(--font-num);font-size:.8rem;background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.newcat{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--sunk)}
.newcat .seg{background:var(--surface)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:#fff;font-size:.66rem;display:grid;place-items:center}
.tab.add{padding-top:0}
.tab.add .plus{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 18px rgba(15,111,98,.35);border:4px solid var(--surface)}
.tab.add .plus svg{width:24px;height:24px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,18,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:999px;font-size:1.15rem;line-height:1;flex:none}
.big-choice{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.big-choice:hover{background:var(--sunk)}

<script>
"use strict";
/* ================= version ================= */
const APP_VERSION = "2.3.0";   // build.sh copies this into sw.js so the offline cache updates with each release
const CHANGELOG = [
  ["2.3.0", "2026-10-21", ["Take-home pay calculator for you and your partner (tax, Medicare, HELP, super, deductions)", "Budget built on combined regular take-home pay", "Bonuses and share deposits flagged and kept out of the budget", "Version info and update check in Settings"]],

  ["1.0.0", "2026-10-16", ["First version: CSV import, rules, bills, buckets, backup"]],

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F0 = new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0});
const F2 = new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2,maximumFractionDigits:2});
const money = (n, cents) => (cents ? F2 : F0).format(Math.abs(n) < 0.005 ? 0 : n);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_L = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad2 = n => String(n).padStart(2, "0");
const dayNum = iso => Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)) / 864e5;
const isoOf = n => new Date(n*864e5).toISOString().slice(0,10);
const addDays = (iso, d) => isoOf(dayNum(iso) + d);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDate = iso => `${+iso.slice(8,10)} ${MONTHS[+iso.slice(5,7)-1]}`;
const fmtDateY = iso => `${+iso.slice(8,10)} ${MONTHS[+iso.slice(5,7)-1]} ${iso.slice(0,4)}`;
const shiftMonth = (m, k) => { const d = new Date(+m.slice(0,4), +m.slice(5,7)-1+k, 1); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; };
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), h=s.length>>1; return s.length%2 ? s[h] : (s[h-1]+s[h])/2; };
const mean = a => a.reduce((s,x)=>s+x,0)/(a.length||1);
const stdev = a => { const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)**2))); };
const norm = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const titleCase = s => s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\b(Anz|Ing|Cba|Ato|Nrma|Rlss|Scecs|Sjja|Oshc|Bp|Nsw|Au|Tv|Bpay)\b/g, w => w.toUpperCase());
const ord = d => d + (d % 10 === 1 && d !== 11 ? "st" : d % 10 === 2 && d !== 12 ? "nd" : d % 10 === 3 && d !== 13 ? "rd" : "th");
const pctTxt = v => `${Math.round(v * 10) / 10}%`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ================= categories ================= */
// type: fixed = Bills, flexible = Spending, income = Income, saving = Savings, transfer = ignored
const BUILTIN_CATS = [
 ["mortgage","Mortgage","Home","fixed"],["stpeters","St Peters mortgage","Home","fixed"],["homeins","Home insurance","Home","fixed"],["council","Council rates","Home","fixed"],["water","Water rates","Home","fixed"],["pool","Pool maintenance","Home","fixed"],["gardener","Gardener","Home","flexible"],["cleaning","Home cleaning","Home","flexible"],
 ["electricity","Electricity","Utilities","fixed"],["gas","Gas","Utilities","fixed"],["internet","Internet","Utilities","fixed"],["mobile","Mobile","Utilities","fixed"],
 ["taxdebt","Tax debt (ATO)","Tax","fixed"],
 ["childcare","Childcare","Kids","fixed"],["oshc","OSHC","Kids","fixed"],["swimming","Swimming lessons","Kids","fixed"],["bjj","BJJ","Kids","fixed"],
 ["spotify","Music","Subscriptions","flexible"],["streaming","Streaming TV","Subscriptions","flexible"],["cloud","Cloud storage","Subscriptions","flexible"],
 ["fuel","Fuel","Car","flexible"],["tolls","Tolls & parking","Car","flexible"],["carmaint","Car maintenance & rego","Car","fixed"],["carins","Car insurance","Car","fixed"],
 ["groceries","Groceries","Household","flexible"],["petcare","Petcare","Household","flexible"],["amazon","Amazon","Household","flexible"],
 ["eatingout","Eating out","Lifestyle","flexible"],["shopping","Shopping","Lifestyle","flexible"],["occasions","Special occasions","Lifestyle","flexible"],["healthcare","Healthcare","Lifestyle","flexible"],["splurge","Splurge","Lifestyle","flexible"],["cash","Cash withdrawal","Lifestyle","flexible"],
 ["uncat","Needs a category","Other","flexible"],["other","Other spending","Other","flexible"],
 ["salary","Salary","Income","income"],["otherincome","Other income","Income","income"],
 ["savings","Savings & investments","Savings","saving"],
 ["transfer","Transfer between accounts","Transfers","transfer"],["ccpay","Credit card payment","Transfers","transfer"],
].map(([id,name,group,type]) => ({id,name,group,type}));
const BUILTIN_GROUPS = ["Home","Utilities","Tax","Kids","Subscriptions","Car","Household","Lifestyle","Other","Income","Savings","Transfers"];
const KIND = {fixed:"bills", flexible:"spend", income:"income", saving:"saved", transfer:null};
const KIND_LABEL = {bills:"Bills", spend:"Spending", saved:"Saved", income:"Money in"};
const TYPE_LABEL = {flexible:"Spending", fixed:"Bill", income:"Income", saving:"Savings"};
let CATS = BUILTIN_CATS, CAT = Object.fromEntries(BUILTIN_CATS.map(c => [c.id, c])), GROUPS = BUILTIN_GROUPS;
function rebuildCats(){
  const custom = (S && S.customCats || []).map(c => ({...c, custom:true}));
  CATS = [...BUILTIN_CATS, ...custom];
  CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const extra = [...new Set(custom.map(c => c.group))].filter(g => !BUILTIN_GROUPS.includes(g));
  GROUPS = [...BUILTIN_GROUPS.slice(0, -3), ...extra, ...BUILTIN_GROUPS.slice(-3)];
}
const cat = id => CAT[id] || CAT.uncat;
const kindOf = id => KIND[cat(id).type];

// [keyword, category, direction?] — direction "out" = money leaving, "in" = money arriving
const SEED_RULES = [
 ["SAVINGS MAXIMISER","savings"],["ING SAVINGS","savings"],["SAVINGS ACCOUNT","savings"],["COMMSEC","savings"],["CMC MARKETS","savings"],["RAIZ","savings"],["SPACESHIP","savings"],["VANGUARD","savings"],["STAKE","savings"],
 ["TAX REFUND","otherincome","in"],["ATO","taxdebt","out"],["ATO","otherincome","in"],["AUSTRALIAN TAXATION","taxdebt","out"],["AUSTRALIAN TAXATION","otherincome","in"],["TAX OFFICE","taxdebt","out"],
 ["TRANSFER TO","transfer"],["TRANSFER FROM","transfer"],["INTERNET TRANSFER","transfer"],["ORANGE EVERYDAY","transfer"],
 ["PAYMENT THANKYOU","ccpay"],["PAYMENT THANK YOU","ccpay"],["PAYMENT RECEIVED","ccpay"],["CREDIT CARD PAYMENT","ccpay"],
 ["ATM","cash","out"],["CASH WITHDRAWAL","cash","out"],["CASH OUT","cash","out"],
 ["SALARY","salary","in"],["PAYROLL","salary","in"],["WAGES","salary","in"],
 ["HOME LOAN","mortgage"],["ST PETERS","stpeters"],["ANZ INSURANCE","homeins"],["HOME INSURANCE","homeins"],
 ["CITY OF RYDE","council"],["RYDE COUNCIL","council"],["SYDNEY WATER","water"],["POOL","pool"],
 ["ORIGIN ENERGY ELECTRICITY","electricity"],["ORIGIN ENERGY GAS","gas"],["ORIGIN","electricity"],["AGL","electricity"],["ENERGYAUSTRALIA","electricity"],["JEMENA","gas"],
 ["OPTUS","internet"],["AUSSIE BROADBAND","internet"],["TELSTRA","mobile"],["VODAFONE","mobile"],["BELONG","mobile"],["AMAYSIM","mobile"],["BOOST MOBILE","mobile"],
 ["RED ROBIN","childcare"],["SCECS","oshc"],["OSHC","oshc"],["ROYAL LIFE","swimming"],["RLSS","swimming"],["SJJA","bjj"],["JIU JITSU","bjj"],["BJJ","bjj"],
 ["SPOTIFY","spotify"],["NETFLIX","streaming"],["APPLE TV","streaming"],["DISNEY","streaming"],["STAN COM AU","streaming"],["BINGE","streaming"],["YOUTUBE PREMIUM","streaming"],
 ["GOOGLE ONE","cloud"],["GOOGLE STORAGE","cloud"],["ICLOUD","cloud"],["DROPBOX","cloud"],
 ["AMAZON","amazon"],["AMZN","amazon"],
 ["AMPOL","fuel"],["BP","fuel"],["SHELL","fuel"],["CALTEX","fuel"],["7 ELEVEN","fuel"],["UNITED PETROLEUM","fuel"],["METRO PETROLEUM","fuel"],
 ["LINKT","tolls"],["E TOLL","tolls"],["ETOLL","tolls"],["TRANSURBAN","tolls"],["WILSON PARKING","tolls"],["SECURE PARKING","tolls"],["PARKING","tolls"],
 ["SERVICE NSW","carmaint"],["REPCO","carmaint"],["MYCAR","carmaint"],["NRMA","carins"],["AAMI","carins"],["BUDGET DIRECT","carins"],["YOUI","carins"],
 ["WOOLWORTHS","groceries"],["COLES","groceries"],["ALDI","groceries"],["IGA","groceries"],["HARRIS FARM","groceries"],["RITAS","groceries"],["RITA S","groceries"],["COSTCO","groceries"],["BOX DIVVY","groceries"],["BOXDIVVY","groceries"],
 ["PETBARN","petcare"],["PETSTOCK","petcare"],["PET CIRCLE","petcare"],["VET","petcare"],["VETERINARY","petcare"],
 ["UBER EATS","eatingout"],["MENULOG","eatingout"],["DOORDASH","eatingout"],["MCDONALDS","eatingout"],["CAFE","eatingout"],["RESTAURANT","eatingout"],
 ["CHEMIST","healthcare"],["PHARMACY","healthcare"],["PRICELINE","healthcare"],["MEDICAL","healthcare"],["DENTAL","healthcare"],["BUPA","healthcare"],["MEDIBANK","healthcare"],["HCF","healthcare"],["NIB","healthcare"],
 ["KMART","shopping"],["TARGET","shopping"],["BIG W","shopping"],["JB HI FI","shopping"],["BUNNINGS","shopping"],["MYER","shopping"],["IKEA","shopping"],
].map(([kw, c, dir]) => ({kw:norm(kw), cat:c, dir, seed:true}));

const STRIP = new Set(["VISA","DEBIT","PURCHASE","CARD","EFTPOS","POS","DIRECT","DD","PAYMENT","TO","AU","AUS","AUD","NSW","PTY","LTD","TAP","AND","PAY","BPAY"]);
function merchantKey(desc){
  const toks = norm(desc).split(" ").filter(t => t && !/^\d+$/.test(t) && t.length > 1);
  let i = 0; while (i < toks.length-1 && STRIP.has(toks[i])) i++;
  return toks.slice(i, i+3).join(" ") || norm(desc);
}
function suggestKeyword(t){ const toks = t.key.split(" "); return toks[0] && toks[0].length >= 5 ? toks[0] : toks.slice(0,2).join(" "); }
const ruleHit = (n, kw) => (" "+n+" ").includes(" "+kw+" ");
const ruleFits = (t, r) => ruleHit(t.norm, r.kw) && (!r.dir || (r.dir === "out") === (t.amount < 0));

/* ================= state & storage ================= */
const DEFAULT_BUCKETS = () => [
  {id:"expenses", name:"Expenses", acct:"ING Orange Everyday", kind:"spend", pct:60},
  {id:"splurge", name:"Splurge", acct:"Cash", kind:"spend", pct:10, cat:"splurge"},
  {id:"rainy", name:"Rainy Day", acct:"ING Savings (joint)", kind:"goal", goalType:"months", months:3, pct:10, balance:0},
  {id:"reno", name:"Reno", acct:"ING Savings (Tim)", kind:"goal", pct:4, target:50000, due:addDays(todayISO(), 730), balance:0},
  {id:"savings", name:"Savings", acct:"ING Savings (joint)", kind:"save", pct:10},
  {id:"growth", name:"Growth Fund", acct:"CBA CommSec", kind:"save", pct:3.5},
  {id:"car", name:"Car Residual", acct:"", kind:"goal", pct:null, target:29000, due:addDays(todayISO(), 730), balance:0},
  {id:"holiday", name:"Holiday", acct:"", kind:"goal", pct:null, target:10000, due:addDays(todayISO(), 365), balance:0},
];
function freshState(){ return {v:3, txns:[], userRules:[], customCats:[], buckets:DEFAULT_BUCKETS(), hiddenRecurring:[], mappings:{}, accounts:{}, sample:false, startDay:15, salary:null, earners:[], bonusDone:{}, reviews:{}, ai:{url:"", token:""}, stepDone:{}, lastImport:null}; }
let S = null;
const UI = { tab:"home", period:null, filter:"all", q:"", topKind:"spend", topAll:false, saveAll:false, busy:null, suggestion:null };

const store = (() => {
  let dbp = null;
  const open = () => dbp ||= new Promise((res, rej) => { try { const r = indexedDB.open("cashflo", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } });
  return {
    async get(){ try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get("state"); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
      catch { try { const s = localStorage.getItem("cashflo"); return s ? JSON.parse(s) : null; } catch { return null; } } },
    async set(v){ try { const db = await open(); await new Promise((res, rej) => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, "state"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
      catch { try { localStorage.setItem("cashflo", JSON.stringify(v)); } catch {} } }
  };
})();
let GEN = 0, saveT = 0;
const save = () => { GEN++; clearTimeout(saveT); saveT = setTimeout(() => store.set(S), 250); };

/* ================= categorising ================= */
const rules = () => [...S.userRules, ...SEED_RULES];
const isSavingsAcct = a => !!(S.accounts[a] && S.accounts[a].savings);
function makeTxn(o){ const t = {...o, norm:norm(o.desc), key:merchantKey(o.desc), cat:"uncat", src:"default"}; applyRules(t, rules()); return t; }
function applyRules(t, rs){
  if (t.src === "manual") return;
  if (t.amount > 0 && salaryKeys().has(t.key)) { t.cat = "salary"; t.src = "salary"; return; }
  const r = rs.find(r => ruleFits(t, r));
  if (r) { t.cat = r.cat; t.src = "rule"; } else { t.cat = t.amount > 0 ? "otherincome" : "uncat"; t.src = "default"; }
}
function recategorize(){
  const rs = rules(); for (const t of S.txns) applyRules(t, rs);
  // match the two sides of a move between my own accounts (same amount, opposite sign, within 3 days)
  const open = S.txns.filter(t => !t.cash && (t.src === "default" || (t.src === "rule" && ["transfer","saving"].includes(cat(t.cat).type))));
  const byAmt = new Map(); for (const t of open) { const k = Math.abs(t.amount).toFixed(2); (byAmt.get(k) || byAmt.set(k, []).get(k)).push(t); }
  const used = new Set();
  for (const list of byAmt.values()) for (const a of list) {
    if (used.has(a) || a.amount >= 0) continue;
    const b = list.find(b => !used.has(b) && b.amount === -a.amount && b.acct !== a.acct && Math.abs(dayNum(a.date) - dayNum(b.date)) <= 3);
    if (!b) continue; used.add(a); used.add(b);
    const toSav = isSavingsAcct(b.acct) && !isSavingsAcct(a.acct), fromSav = isSavingsAcct(a.acct) && !isSavingsAcct(b.acct);
    a.cat = toSav ? "savings" : "transfer"; b.cat = fromSav ? "savings" : "transfer"; a.src = b.src = "auto";
  }
  // money moving inside a savings account is already counted on the everyday side
  for (const t of S.txns) if (t.src !== "manual" && isSavingsAcct(t.acct) && cat(t.cat).type === "saving") { t.cat = "transfer"; t.src = "auto"; }
}

/* ================= salary & pay periods ================= */
function salaryCandidates(){
  const g = {};
  for (const t of S.txns) { if (t.amount <= 0 || t.cash || isSavingsAcct(t.acct)) continue; const ty = cat(t.cat).type; if (ty === "transfer" || ty === "saving") continue; (g[t.key] ||= []).push(t); }
  const out = [];
  for (const [key, list] of Object.entries(g)) {
    const amts = list.map(t => t.amount), med = median(amts); if (list.length < 2 || med < 300) continue;
    const dates = [...new Set(list.map(t => t.date))].sort(), gaps = [];
    for (let i = 1; i < dates.length; i++) gaps.push(dayNum(dates[i]) - dayNum(dates[i-1]));
    const mg = median(gaps), freq = mg >= 25 && mg <= 36 ? "monthly" : mg >= 12 && mg <= 16 ? "fortnightly" : mg >= 6 && mg <= 8 ? "weekly" : null;
    if (!freq || stdev(amts) / mean(amts) > 0.3) continue;
    out.push({key, name:titleCase(key), freq, typical:med, monthly: freq === "monthly" ? med : freq === "fortnightly" ? med*26/12 : med*52/12, count:list.length, last:dates.at(-1)});
  }
  return out.sort((a,b) => b.monthly - a.monthly);
}
function ensureSalary(){
  if (S.salary && S.salary.confirmed && S.txns.some(t => t.key === S.salary.key)) return;
  const c = salaryCandidates().filter(c => !(S.salaryNo || []).includes(c.key));
  S.salary = c.length ? {key:c[0].key, name:c[0].name, confirmed:false} : null;
}
function payEvents(){

const startDay = () => Math.min(28, Math.max(1, +S.startDay || 15));
let _ps = {gen:-1, today:"", starts:[], ev:[]};
function periodStarts(){

}

const periodEnd = k => addDays(nextStart(k), -1);

/* ================= take-home pay (ATO resident rates) ================= */
// Rates checked Oct 2026: brackets (16% band falls to 15% on 1 Jul 2026, 14% from 1 Jul 2027), LITO, 2% Medicare levy,
// HELP marginal repayment system, super guarantee 12%, max contribution base $270,830, concessional cap $32,500 (2026-27).
const curFY = (iso = todayISO()) => +iso.slice(5,7) >= 7 ? +iso.slice(0,4) : +iso.slice(0,4) - 1;  // 2026 = 2026-27
const fyLabel = fy => `${fy}–${String(fy + 1).slice(2)}`;
function bracketTax(ti, fy){
  const low = fy <= 2024 ? 0.16 : fy === 2025 ? 0.16 : fy === 2026 ? 0.15 : 0.14;
  const B = [[18200, 0], [45000, low], [135000, 0.30], [190000, 0.37], [Infinity, 0.45]];
  let tax = 0, prev = 0; for (const [top, r] of B) { if (ti > prev) tax += (Math.min(ti, top) - prev) * r; prev = top; } return tax;
}
const lito = ti => ti <= 37500 ? 700 : ti <= 45000 ? 700 - 0.05 * (ti - 37500) : ti <= 66667 ? Math.max(0, 325 - 0.015 * (ti - 45000)) : 0;
const medicareLevy = ti => ti <= 28011 ? 0 : ti <= 35013 ? 0.1 * (ti - 28011) : 0.02 * ti;   // low-income phase-in uses 2025–26 thresholds
function helpRepay(ri, fy){
  const T = fy >= 2026 ? [69528, 129717, 186050, 9028] : [67000, 125000, 179285, 8700];
  return ri <= T[0] ? 0 : ri <= T[1] ? 0.15 * (ri - T[0]) : ri <= T[2] ? T[3] + 0.17 * (ri - T[1]) : 0.10 * ri;
}
const PER_YEAR = {monthly:12, fortnightly:26, weekly:52};
function calcPay(e){
  const fy = curFY(), sgR = (isFinite(parseFloat(e.sg)) ? +e.sg : 12) / 100, base = +e.base || 0;
  const salary = e.inclSuper ? base / (1 + sgR) : base, sgAmt = Math.min(salary, 270830) * sgR;
  const sac = +e.sacrifice || 0, pre = +e.preTax || 0, post = +e.postTax || 0;
  const taxable = Math.max(0, salary - sac - pre);
  const tax = Math.max(0, bracketTax(taxable, fy) - lito(taxable)), medicare = medicareLevy(taxable);
  const help = e.help ? helpRepay(taxable + sac, fy) : 0;
  const take = salary - sac - pre - tax - medicare - help - post, per = PER_YEAR[e.freq] || 12;
  return {fy, salary, sgAmt, sac, pre, post, taxable, tax, medicare, help, take, per, perPay: take / per, monthly: take / 12, capOver: Math.max(0, sgAmt + sac - 32500)};
}
const activeEarners = () => (S.earners || []).filter(e => +e.base > 0);
const salaryKeys = () => new Set([...(S.salary ? [S.salary.key] : []), ...(S.earners || []).map(e => e.key).filter(Boolean)]);
function expectedPerPay(key){
  const e = (S.earners || []).find(e => e.key === key && +e.base > 0); if (e) return {amt: calcPay(e).perPay, freq: e.freq || "monthly", e};
  const ds = S.txns.filter(t => t.amount > 0 && t.key === key).map(t => t.amount); if (!ds.length) return null;
  const c = salaryCandidates().find(c => c.key === key); return {amt: median(ds), freq: c ? c.freq : "monthly"};
}
// deposits above regular pay (bonus, shares sold through payroll, back pay) — kept out of the budget
function bonusesIn(k){
  const out = [];
  for (const key of salaryKeys()) {
    const ex = expectedPerPay(key); if (!ex || !ex.amt) continue;
    const ds = S.txns.filter(t => t.amount > 0 && t.key === key && periodOf(t.date) === k);
    if (ex.freq === "monthly") {
      ds.sort((a, b) => Math.abs(a.amount - ex.amt) - Math.abs(b.amount - ex.amt));
      ds.forEach((t, i) => { const extra = i === 0 ? t.amount - ex.amt : t.amount; if (extra > Math.max(100, ex.amt * 0.1)) out.push({t, extra, who: ex.e ? ex.e.name : titleCase(key)}); });
    } else for (const t of ds) { const extra = t.amount - ex.amt; if (extra > Math.max(100, ex.amt * 0.1)) out.push({t, extra, who: ex.e ? ex.e.name : titleCase(key)}); }
  }
  return out;
}

/* ================= numbers ================= */
let _st = {gen:-1, m:new Map()};
function periodStats(k){
  if (_st.gen !== GEN) _st = {gen:GEN, m:new Map()};
  if (_st.m.has(k)) return _st.m.get(k);
  const SK = salaryKeys();
  const r = {k, income:0, salary:0, bills:0, spend:0, saved:0, byCat:{}, byGroup:{}, cashOut:0, cashLogged:0, cashLoggedSplurge:0, n:0};
  for (const t of S.txns) {
    if (periodOf(t.date) !== k) continue;
    r.n++;
    if (t.amount > 0 && SK.has(t.key)) r.salary += t.amount;
    const c = cat(t.cat), kind = KIND[c.type]; if (!kind) continue;
    if (kind === "income") { r.income += t.amount; continue; }
    const v = -t.amount;
    if (kind === "saved") { r.saved += v; continue; }
    r[kind] += v; r.byCat[c.id] = (r.byCat[c.id]||0) + v; r.byGroup[c.group] = (r.byGroup[c.group]||0) + v;
    if (t.cash) { r.cashLogged += v; if (c.id === "splurge") r.cashLoggedSplurge += v; }
    if (c.id === "cash") r.cashOut += v;
  }
  // a cash withdrawal counts as spending; logged cash spends break it down instead of adding to it
  const off = Math.min(r.cashLogged, r.cashOut);
  if (off > 0) { r.byCat.cash -= off; r.byGroup.Lifestyle -= off; r.spend -= off; if (r.byCat.cash < 0.005) delete r.byCat.cash; }
  r.cashTotal = Math.max(r.cashOut, r.cashLogged);
  r.splurge = r.cashTotal + (r.byCat.splurge || 0) - r.cashLoggedSplurge;
  r.everyday = r.bills + r.spend - r.splurge;
  r.out = r.bills + r.spend + r.saved; r.left = r.income - r.out;
  r.bonuses = bonusesIn(k); r.bonus = r.bonuses.reduce((s, b) => s + b.extra, 0);

}
// the 3 most recent periods before k that have data (fewer if not available)
function basePeriods(k){ const ps = periodsWithData().filter(p => p < k && periodStats(p).n >= 5); return ps.slice(-3); }
function avgStat(field, k = curPeriod()){ const ps = basePeriods(k); if (!ps.length) { const all = periodsWithData().filter(p => p !== curPeriod()); if (!all.length) return 0; return mean(all.slice(-3).map(p => periodStats(p)[field])); } return mean(ps.map(p => periodStats(p)[field])); }

function salaryBudget(){
  const es = activeEarners(); if (es.length) return es.reduce((s, e) => s + calcPay(e).monthly, 0);
  periodStarts(); const ev = _ps.ev.slice(-3);
  const amts = ev.map(k => { const st = periodStats(k); return st.salary - st.bonus; }).filter(v => v > 0);
  if (amts.length) return median(amts);

}
const budgetBasis = () => activeEarners().length ? "take-home pay" : S.salary && _ps.ev.length ? "salary" : "income";

/* ================= buckets ================= */
const bucket = id => S.buckets.find(b => b.id === id);

const goalTarget = (b, monthlyExp) => b.goalType === "months" ? (b.months||3) * monthlyExp : (+b.target || 0);
function goalNeed(b, monthlyExp){
  if (b.kind !== "goal") return null;
  const left = Math.max(0, goalTarget(b, monthlyExp) - (+b.balance || 0));
  return b.goalType === "months" ? left / 12 : left / monthsUntil(b.due || addDays(todayISO(), 365));

  return {inc, exp, rows, used, unallocated: inc - used, plannedSave: rows.filter(r => r.b.kind !== "spend").reduce((s, r) => s + r.monthly, 0)};

/* ================= recurring ================= */
const FREQS = [
  {id:"weekly", label:"Weekly", days:7, min:5, max:9},
  {id:"fortnightly", label:"Fortnightly", days:14, min:11, max:17},
  {id:"monthly", label:"Monthly", days:30.44, min:25, max:36},
  {id:"bimonthly", label:"Every 2 months", days:60.9, min:52, max:70},
  {id:"quarterly", label:"Quarterly", days:91.3, min:80, max:100},
  {id:"annual", label:"Yearly", days:365.25, min:330, max:400},
];
let _rec = {gen:-1, v:[]};
function detectRecurring(){
  if (_rec.gen === GEN) return _rec.v;
  const groups = {};
  for (const t of S.txns) { if (t.amount >= 0 || t.cash) continue; const c = cat(t.cat); if (!["fixed","flexible"].includes(c.type) || c.id === "cash") continue; (groups[t.key] ||= []).push(t); }
  const out = [], today = dayNum(todayISO());
  for (const [key, list] of Object.entries(groups)) {
    if (S.hiddenRecurring.includes(key) || list.length < 2) continue;
    list.sort((a,b) => a.date < b.date ? -1 : 1);
    const ints = []; for (let i = 1; i < list.length; i++) { const d = dayNum(list[i].date) - dayNum(list[i-1].date); if (d > 0) ints.push(d); }
    if (!ints.length) continue;
    const mi = median(ints), f = FREQS.find(f => mi >= f.min && mi <= f.max); if (!f) continue;
    if (list.length < (f.days <= 31 ? 3 : 2)) continue;
    if (ints.filter(d => Math.abs(d - mi) > Math.max(3, mi*0.35)).length / ints.length > 0.34) continue;

    const last = list.at(-1), lastAmt = -last.amount, prevAmt = median(amts.slice(0,-1)), rise = (lastAmt - prevAmt) / prevAmt;
    const next = addDays(last.date, Math.round(f.days));

      monthly: lastAmt * 365.25 / f.days / 12, next, overdue: today > dayNum(next) + Math.max(5, f.days*0.5), rise: rise >= 0.08 && lastAmt - prevAmt >= 2 ? rise : 0});
  }

}

  for (const arr of Object.values(byCat)) if (arr.length > 1) { const low = Math.min(...arr.map(r => r.monthly)); W.push({t:`${arr.length} ${arr[0].cat.name.charAt(0).toLowerCase() + arr[0].cat.name.slice(1)} services`, b:`${arr.map(r => r.name).join(" and ")} overlap. Keep one.`, save:low*12, go:"bills", btn:"See subscriptions"}); }

// rule-based split, used without AI
function ruleSplit(){
  const inc = salaryBudget(); if (!inc) return null;
  const ps = basePeriods(curPeriod()).length ? basePeriods(curPeriod()) : periodsWithData().filter(p => p !== curPeriod()).slice(-3);
  if (!ps.length) return null;
  const av = f => mean(ps.map(p => periodStats(p)[f])), everyday = av("everyday"), splurge = av("splurge"), exp = av("bills") + av("spend");
  const p = v => Math.ceil(v / inc * 200) / 2, rows = {}, warnings = [];
  rows.expenses = {pct: p(everyday * 1.03), why:`Covers your usual bills and everyday spending (${money(everyday)}) plus a 3% buffer.`};
  rows.splurge = {pct: p(splurge), why:`Your usual cash and splurge spending is ${money(splurge)} a pay.`};
  for (const b of S.buckets.filter(b => b.kind === "goal")) {
    const need = goalNeed(b, exp) || 0, tgt = goalTarget(b, exp);
    rows[b.id] = b.goalType === "months"
      ? (need <= 0 ? {pct:0, why:`Already holds ${b.months} months of expenses. Send this money to another goal.`} : {pct:p(need), why:`Builds ${money(tgt)} (${b.months} months of expenses) within a year.`})
      : {pct:p(need), why:`Reaches ${money(+b.target)} by ${fmtDateY(b.due)} (${money(need)} a month).`};
  }
  let used = Object.values(rows).reduce((s, r) => s + r.pct, 0);
  const saveBs = S.buckets.filter(b => b.kind === "save"), room = 100 - used;
  if (room > 0) {
    const g = bucket("growth"), gp = g && hasPct(g) ? Math.min(+g.pct, room) : 0;
    for (const b of saveBs) rows[b.id] = b.id === "growth" ? {pct:gp, why: gp ? `Keeps your ${gp}% investing habit going.` : "No room left this time."} : {pct:0, why:"Cashflo puts the leftover into your main Savings bucket. Set your own % if you want money here."};
    const s = saveBs.find(b => b.id !== "growth") || saveBs[0];
    if (s) rows[s.id] = {pct: Math.max(0, Math.floor((room - (s.id === "growth" ? 0 : gp)) * 2) / 2), why:"Gets everything left over, so no money goes unplanned."};
  } else {
    for (const b of saveBs) rows[b.id] = {pct:0, why:"No room left after bills, spending and goals."};
    const reno = bucket("reno");
    warnings.push(`These goals need ${pctTxt(-room)} more than your salary.${reno && reno.target ? ` Stretching Reno to 5 years would free about ${money((goalNeed(reno, exp) || 0) - Math.max(0, (+reno.target - (+reno.balance||0))) / 60)} a month.` : ""}`);
  }
  used = Object.values(rows).reduce((s, r) => s + r.pct, 0);
  return {src:"rule", rows, summary:`Based on your last ${plural(ps.length, "pay")}: bills and everyday spending take ${pctTxt(everyday / inc * 100)} of your salary. This plan uses ${pctTxt(used)}.`, warnings};
}

function parseCSV(text){
  text = text.replace(/^﻿/, ""); const first = text.split("\n")[0]; const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }

}
function parseDate(s){
  s = String(s||"").trim(); let m;
  const ok = (y, mo, d) => (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y > 1990) ? `${y}-${pad2(mo)}-${pad2(d)}` : null;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) return ok(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  if ((m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})$/))) { const mo = MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase()) + 1; if (mo) return ok(m[3].length === 2 ? 2000 + +m[3] : +m[3], mo, +m[1]); }
  return null;
}
function parseAmount(s){
  s = String(s ?? "").trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1,-1); }
  if (/\bDR$/i.test(s)) { neg = true; s = s.replace(/DR$/i, ""); } else if (/\bCR$/i.test(s)) s = s.replace(/CR$/i, "");

}
function detectMapping(rows){
  const first = rows[0], sample = rows.slice(0, 40), cols = Math.max(...sample.map(r => r.length));
  const hasHeader = first.every(c => !parseDate(c) && parseAmount(c) === null) && first.some(c => /[a-z]/i.test(c));
  const body = hasHeader ? sample.slice(1) : sample, h = hasHeader ? first.map(c => c.toLowerCase().trim()) : [];
  const st = Array.from({length: cols}, (_, i) => { const v = body.map(r => r[i] ?? ""); return { date: v.filter(x => parseDate(x)).length / (v.length||1), num: v.filter(x => parseAmount(x) !== null).length / (v.length||1), neg: v.some(x => (parseAmount(x) ?? 0) < 0), len: mean(v.map(x => x.length)) }; });
  const find = re => h.findIndex(x => re.test(x));
  let date = find(/date/); if (date < 0) date = st.reduce((b, s, i) => s.date > (st[b]?.date ?? -1) ? i : b, 0);
  let debit = find(/debit|withdraw|money out/), credit = find(/credit|deposit|money in/), amount = find(/^amount|amount$|value/);
  if (amount >= 0 || debit < 0 || credit < 0) { debit = credit = -1; }
  if (amount < 0 && debit < 0) { const bal = find(/balance/); const nums = st.map((s, i) => i).filter(i => i !== date && i !== bal && st[i].num > 0.8); amount = nums.find(i => st[i].neg) ?? nums[0] ?? -1; }
  let desc = find(/desc|narrat|details|transaction|merchant|particulars|memo/);
  if (desc < 0) desc = st.reduce((b, s, i) => (i !== date && i !== amount && s.num < 0.5 && s.len > (st[b]?.len ?? -1)) ? i : b, -1);
  return {hasHeader, date, desc, amount, debit, credit, flip:false, cols};
}

function newCatFields(prefix){ return `<div class="newcat" id="${prefix}New" hidden><div class="grid2">
  <label class="field"><span>Category name</span><input class="input" id="${prefix}NName" maxlength="40" placeholder="e.g. Kids' activities"></label>
  <label class="field"><span>Group</span><input class="input" id="${prefix}NGroup" list="groupList" maxlength="30" placeholder="e.g. Kids"></label></div>
  <div class="seg" role="radiogroup" aria-label="Type">${["flexible","fixed","income","saving"].map((t, i) => `<label><input type="radio" name="${prefix}NType" value="${t}" ${i === 0 ? "checked" : ""}><span>${TYPE_LABEL[t]}</span></label>`).join("")}</div>
  <p class="small muted">Bill = regular, locked-in cost. Spending = things you can cut back. Savings = money put aside.</p></div>
  <datalist id="groupList">${GROUPS.filter(g => g !== "Transfers").map(g => `<option value="${esc(g)}">`).join("")}</datalist>`; }
function wireNewCat(prefix){ const sel = $(`#${prefix}Cat`), box = $(`#${prefix}New`); const sync = () => { box.hidden = sel.value !== "__new"; if (!box.hidden) $(`#${prefix}NName`).focus(); }; sel.addEventListener("change", sync); sync(); }
function resolveCat(prefix){
  const v = $(`#${prefix}Cat`).value; if (!v) { toast("Choose a category."); return null; } if (v !== "__new") return v;
  return addCategory($(`#${prefix}NName`).value.trim(), $(`#${prefix}NGroup`).value.trim(), panel.querySelector(`input[name="${prefix}NType"]:checked`).value);
}
function addCategory(name, group, type, editId){
  if (!name) { toast("Give the category a name."); return null; }
  group = group || (type === "income" ? "Income" : type === "saving" ? "Savings" : "Other");
  if (group.toLowerCase() === "transfers") { toast("Pick a different group. Transfers is kept for moves between your accounts."); return null; }
  const clash = CATS.find(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== editId);
  if (clash) { toast(`There's already a category called ${clash.name}.`); return null; }
  const g = GROUPS.find(x => x.toLowerCase() === group.toLowerCase()) || group.replace(/\b[a-z]/g, ch => ch.toUpperCase());
  if (editId) Object.assign(S.customCats.find(c => c.id === editId), {name, group:g, type});
  else { editId = "u_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24) + "_" + Date.now().toString(36); S.customCats.push({id:editId, name, group:g, type}); }
  rebuildCats(); save(); return editId;
}

function openTxn(id){
  const t = S.txns.find(x => x.id === id); if (!t) return;
  const kw = suggestKeyword(t), countFor = w => S.txns.filter(x => x.src !== "manual" && ruleHit(x.norm, norm(w))).length;
  const canSalary = t.amount > 0 && !t.cash && !(S.salary && S.salary.key === t.key);
  openSheet(`${sheetHead(titleCase(t.key))}
    <div class="muted small" style="overflow-wrap:anywhere">${esc(t.desc)}<br><span class="num">${fmtDateY(t.date)} · ${t.amount > 0 ? "+" : "−"}${money(Math.abs(t.amount), true)} · ${esc(t.acct)}</span></div>

    <label class="chk" id="eRuleRow"><input type="checkbox" id="eRule" checked><span>Make a rule: anything containing <input class="input num" id="eKw" value="${esc(kw)}" style="height:34px;width:auto;display:inline-block;max-width:100%;margin:4px 0"> goes here <span class="muted small" id="eCount">(${plural(countFor(kw), "match")})</span></span></label>
    ${canSalary ? `<button class="btn link small" id="eSalary" style="align-self:flex-start">This is my salary</button>` : ""}
    <div class="actions">${t.cash ? `<button class="btn danger" id="eDel" style="margin-right:auto">Delete</button>` : ""}<button class="btn" data-close>Cancel</button><button class="btn primary" id="eSave">Save</button></div>`);
  wireNewCat("e");
  if (t.cash) { $("#eRule").checked = false; $("#eRuleRow").hidden = true; $("#eDel").onclick = () => { S.txns = S.txns.filter(x => x !== t); save(); closeSheet(); render(); toast("Cash spend deleted."); }; }
  if (canSalary) $("#eSalary").onclick = () => { setSalary(t.key); closeSheet(); };
  $("#eKw").addEventListener("input", () => { $("#eCount").textContent = `(${plural(countFor($("#eKw").value), "match")})`; });
  $("#eSave").onclick = () => {
    const mk = $("#eRule").checked, kwv = norm($("#eKw").value);
    if (mk && kwv && !ruleHit(t.norm, kwv)) { toast("That keyword isn't in this transaction's description."); return; }
    const c = resolveCat("e"); if (!c) return;
    if (mk && kwv) {
      const dir = cat(c).type === "income" || ["ATO","AUSTRALIAN TAXATION"].includes(kwv) ? (t.amount > 0 ? "in" : "out") : undefined;
      S.userRules = [{kw:kwv, cat:c, ...(dir ? {dir} : {})}, ...S.userRules.filter(r => !(r.kw === kwv && r.dir === dir))]; if (t.src === "manual") t.src = "default";
      recategorize(); toast(`Rule saved. ${plural(S.txns.filter(x => x.cat === c && ruleHit(x.norm, kwv)).length, "transaction")} now in ${cat(c).name}.`);
    } else { t.cat = c; t.src = "manual"; toast(`Moved to ${cat(c).name}.`); }
    save(); closeSheet(); render();
  };
}

function setSalary(key){

  else { const c = salaryCandidates().find(c => c.key === key); S.salary = {key, name: c ? c.name : titleCase(key), confirmed:true}; S.salaryNo = (S.salaryNo || []).filter(k => k !== key); }

let pending = null;
async function handleFile(file){
  if (!file) return;
  if (/\.pdf$/i.test(file.name)) { toast("PDF statements aren't supported yet. Export a CSV from internet banking."); return; }
  let rows; try { rows = parseCSV(await file.text()); } catch { toast("Couldn't read that file. Is it a CSV?"); return; }
  if (!rows.length) { toast("That file is empty."); return; }
  const sig = `${rows[0].length}|` + (detectMapping(rows).hasHeader ? rows[0].join("|") : "nohdr");
  const saved = S.mappings[sig];
  pending = {name:file.name, rows, sig, map: saved ? {...saved.map} : detectMapping(rows), acct: saved?.acct || (/anz/i.test(file.name) ? "ANZ Everyday" : /ing/i.test(file.name) ? "ING" : "")};
  openImport();
}
function openImport(){

    <label class="field"><span>Which account is this?</span><input class="input" id="iAcct" list="acctList" value="${esc(p.acct)}" placeholder="e.g. ANZ Everyday, ANZ Visa"><datalist id="acctList">${accts.map(a => `<option value="${esc(a)}">`).join("")}</datalist></label>

    <details ${ok < total * 0.8 ? "open" : ""}><summary>Columns</summary><div class="grid2" style="margin-top:10px">
      <label class="field"><span>Date</span><select class="select" data-m="date">${colOpts(m.date)}</select></label>
      <label class="field"><span>Description</span><select class="select" data-m="desc">${colOpts(m.desc)}</select></label>

      <label class="field"><span>First row is headings</span><select class="select" data-m="hasHeader"><option value="1" ${m.hasHeader ? "selected" : ""}>Yes</option><option value="0" ${!m.hasHeader ? "selected" : ""}>No</option></select></label>

      <label class="chk" style="margin-top:10px"><input type="checkbox" data-m="flip" ${m.flip ? "checked" : ""}><span>Purchases show as positive numbers (common on credit card exports)</span></label></details>
    <div class="preview"><table><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>${parsed.map(r => `<tr><td>${r.date ? fmtDateY(r.date) : `<span class="neg">?</span>`}</td><td>${esc((r.desc||"").slice(0,40)) || `<span class="neg">?</span>`}</td><td class="num ${r.amount > 0 ? "pos" : ""}">${r.amount === null || isNaN(r.amount) ? `<span class="neg">?</span>` : money(r.amount, true)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">${ok} of ${total} rows read cleanly. Money out should show as negative.</p>
    ${S.sample ? `<label class="chk"><input type="checkbox" id="iClearSample" checked><span>Remove the sample data first</span></label>` : ""}
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="iGo" ${ok ? "" : "disabled"}>Import ${ok} transactions</button></div>`);
  panel.querySelectorAll("[data-m]").forEach(el => el.addEventListener("change", () => {

    pending.map[k] = el.type === "checkbox" ? el.checked : k === "hasHeader" ? el.value === "1" : +el.value;
    if (k === "amount" && +el.value >= 0) pending.map.debit = pending.map.credit = -1;
    if ((k === "debit" || k === "credit") && +el.value >= 0) pending.map.amount = -1;
    openImport();
  }));
  $("#iAcct").addEventListener("change", () => { $("#iSav").checked = isSavingsAcct($("#iAcct").value.trim()); });
  $("#iGo").onclick = () => runImport($("#iAcct").value.trim() || "My account", $("#iSav").checked, $("#iClearSample")?.checked);

function buildRows(p){
  const m = p.map, out = [];
  for (let i = m.hasHeader ? 1 : 0; i < p.rows.length; i++) {
    const r = p.rows[i], date = m.date >= 0 ? parseDate(r[m.date]) : null, desc = m.desc >= 0 ? (r[m.desc] || "").trim() : "";
    let amount = null;
    if (m.amount >= 0) amount = parseAmount(r[m.amount]);
    else if (m.debit >= 0 || m.credit >= 0) { const d = parseAmount(r[m.debit]), c = parseAmount(r[m.credit]); if (d !== null || c !== null) amount = Math.abs(c || 0) - Math.abs(d || 0); }
    if (amount !== null && m.flip) amount = -amount;
    out.push({date, desc, amount, ok: !!date && !!desc && amount !== null && !isNaN(amount)});
  }
  return out;
}
function runImport(acct, savings, clearSample){
  if (clearSample) { S.txns = S.txns.filter(t => !t.sample); S.sample = false; S.reviews = {}; }
  S.accounts[acct] = {...(S.accounts[acct] || {}), savings: !!savings};
  const have = new Set(S.txns.map(t => t.id)), counts = {}; let added = 0, dup = 0, bad = 0;
  for (const r of buildRows(pending)) {
    if (!r.ok) { bad++; continue; }
    const base = `${acct}|${r.date}|${r.amount.toFixed(2)}|${norm(r.desc)}`; counts[base] = (counts[base]||0) + 1;
    const id = base + "|" + counts[base]; if (have.has(id)) { dup++; continue; }
    have.add(id); S.txns.push(makeTxn({id, acct, date:r.date, amount:r.amount, desc:r.desc})); added++;
  }
  S.mappings[pending.sig] = {map: pending.map, acct}; S.lastImport = Date.now();
  recategorize(); ensureSalary(); recategorize(); save(); closeSheet();
  UI.period = null; UI.tab = "home"; render();
  toast(`Imported ${added}${dup ? `, skipped ${dup} already here` : ""}${bad ? `, ${bad} unreadable` : ""}.`);
}

function restore(text){
  let d; try { d = JSON.parse(text); } catch { toast("That isn't a Cashflo backup."); return; }
  if (d.app !== "cashflo" || !Array.isArray(d.txns)) { toast("That isn't a Cashflo backup."); return; }
  const keepAI = S.ai; S = migrate({...freshState(), ...d, txns: d.txns.map(t => ({...t, norm:norm(t.desc), key:merchantKey(t.desc)}))});
  if (!S.ai || !S.ai.token) S.ai = keepAI;
  rebuildCats(); recategorize(); ensureSalary(); recategorize(); save(); closeSheet(); UI.period = null; UI.tab = "home"; render(); toast(`Restored ${plural(S.txns.length, "transaction")}.`);
}
function migrate(s){
  if ((s.v || 1) < 2) { const sp = s.buckets.find(b => b.id === "splurge"); if (sp && +sp.pct === 5) sp.pct = 10; }
  s.accounts ||= {}; s.reviews ||= {}; s.stepDone ||= {}; s.customCats ||= []; s.ai ||= {url:"", token:""};
  if ((s.v || 1) < 3) { const ids = new Set(s.buckets.map(b => b.id)); for (const b of DEFAULT_BUCKETS()) if (!ids.has(b.id)) s.buckets.push(b); }
  for (const id of CORE_BUCKETS) if (!s.buckets.some(b => b.id === id)) s.buckets.unshift(DEFAULT_BUCKETS().find(b => b.id === id));
  s.earners ||= []; s.bonusDone ||= {};
  s.v = 3; return s;
}

  if (act === "delEarner") { const e = S.earners[+a.dataset.i]; confirmSheet(`Remove ${e.name}'s pay?`, "Your budget goes back to using the pay that lands in your account.", "Remove", () => { S.earners.splice(+a.dataset.i, 1); recategorize(); save(); render(); }, true); }
  if (act === "payAI") { const i = +a.dataset.i, e = S.earners[i], c = calcPay(e); UI.busy = "pay" + i; render();
    try { const d = await askAI(`Check this Australian take-home pay estimate for one employee (${fyLabel(c.fy)} tax year). Point out anything commonly missed that would change take-home pay (e.g. Medicare levy surcharge without private hospital cover, salary-packaged items, how employee share plans are taxed, HELP). Don't recalculate tax unless something is clearly wrong.
Return JSON exactly like: {"summary":"one sentence","checks":["short point", "..."]} with at most 4 checks.

DATA:
${JSON.stringify({paid:e.freq, salary_basis: e.inclSuper ? "package including super" : "salary plus super", employer_super_pct:+e.sg || 12, salary:Math.round(c.salary), salary_sacrifice_super:c.sac, other_pre_tax:c.pre, after_tax_deductions:c.post, has_help_debt:!!e.help, taxable_income:Math.round(c.taxable), income_tax:Math.round(c.tax), medicare_levy:Math.round(c.medicare), help_repayment:Math.round(c.help), take_home_year:Math.round(c.take), take_home_per_pay:Math.round(c.perPay)})}`, 700);
      UI.payAI = {...(UI.payAI || {}), [e.id]: d}; } catch (err) { toast(err.message); }
    UI.busy = null; render(); }
  if (act === "bonusGoal") { const bk = bucket(a.dataset.b), amt = +a.dataset.amt; if (bk && bk.kind === "goal") bk.balance = (+bk.balance || 0) + amt; S.bonusDone = {...(S.bonusDone || {}), [a.dataset.t]: a.dataset.b}; save(); render(); toast(bk && bk.kind === "goal" ? `${money(amt)} added to ${bk.name}.` : "Marked as done."); }
  if (act === "bonusDone") { S.bonusDone = {...(S.bonusDone || {}), [a.dataset.t]: "done"}; save(); render(); }
  if (act === "bonusAI") runBonusAI(a.dataset.t, +a.dataset.amt);
  if (act === "checkUpdate") {
    if (UI.updateReady) { UI.updateReady.postMessage?.("skip"); location.reload(); return; }
    if (!SWREG) { toast(`You're on ${APP_VERSION}. Updates check automatically on your Cashflo site.`); return; }
    a.disabled = true; a.innerHTML = `<span class="spin"></span>Checking…`;
    try { await SWREG.update(); } catch {}
    setTimeout(() => { if (SWREG.installing || SWREG.waiting) { UI.updateReady = SWREG.waiting || SWREG.installing; toast("A new version is ready. Tap Update ready to reload."); } else toast(`You're up to date (${APP_VERSION}).`); render(); }, 1500);
  }
  if (act === "aiClear") { S.ai = {url:"", token:""}; save(); render(); toast("AI disconnected."); }
  if (act === "addBk") openBucketEditor();
  if (act === "editBk") openBucketEditor(a.dataset.id);
  if (act === "ruleSplit") { const s = ruleSplit(); if (!s) toast("Cashflo needs at least one full pay of data first."); else { UI.suggestion = s; render(); } }
  if (act === "aiSplit") runAISplit();
  if (act === "closeSugg") { UI.suggestion = null; render(); }
  if (act === "applySugg") { let n = 0; view.querySelectorAll("[data-sg]").forEach(c => { if (c.checked) { const b = bucket(c.dataset.sg); b.pct = UI.suggestion.rows[b.id].pct; n++; } }); UI.suggestion = null; save(); render(); toast(`Updated ${plural(n, "bucket")}.`); }
  if (act === "hideRec") { S.hiddenRecurring.push(a.dataset.key); save(); render(); toast("Hidden from bills."); }
  if (act === "unhideRec") { S.hiddenRecurring = []; save(); render(); }
  if (act === "catKey") { const t = S.txns.filter(x => x.key === a.dataset.key).at(-1); if (t) openTxn(t.id); }
  if (act === "addCat") openCatEditor();
  if (act === "editCat") openCatEditor(a.dataset.id);
  if (act === "delRule") { S.userRules.splice(+a.dataset.i, 1); recategorize(); save(); render(); toast("Rule deleted."); }
  if (act === "delAcct") confirmSheet(`Remove ${a.dataset.acct}?`, "This deletes its transactions from Cashflo. Your rules and goals stay.", "Remove", () => { S.txns = S.txns.filter(t => t.acct !== a.dataset.acct); delete S.accounts[a.dataset.acct]; if (!S.txns.some(t => t.sample)) S.sample = false; ensureSalary(); recategorize(); save(); UI.period = null; render(); }, true);
  if (act === "reset") confirmSheet("Delete everything?", "All transactions, rules, goals and settings are removed from this device. Download a backup first if you might want them.", "Delete everything", () => { S = freshState(); rebuildCats(); save(); UI.period = null; UI.tab = "home"; render(); toast("Cashflo has been reset."); }, true);
  if (act === "exportDl") { try { const url = URL.createObjectURL(new Blob([backupJSON()], {type:"application/json"})); const l = document.createElement("a"); l.href = url; l.download = `cashflo-backup-${todayISO()}.json`; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Backup downloaded. If nothing saved, use Copy backup."); } catch { toast("Download isn't available here. Use Copy backup."); } }
  if (act === "exportCopy") { const txt = backupJSON(); try { await navigator.clipboard.writeText(txt); toast("Backup copied. Paste it into a note or file to keep it."); } catch { openSheet(`${sheetHead("Your backup")}<p class="small muted">Select all and copy this text somewhere safe.</p><textarea class="input" id="bkTxt" readonly>${esc(txt)}</textarea>`); $("#bkTxt").select(); } }
  if (act === "restoreFile") $("#restoreIn").click();
  if (act === "restorePaste") { openSheet(`${sheetHead("Restore from text")}<p class="small muted">Paste a Cashflo backup. This replaces what's here now.</p><textarea class="input" id="rsTxt"></textarea><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rsGo">Restore</button></div>`); $("#rsGo").onclick = () => restore($("#rsTxt").value); }
});
view.addEventListener("input", e => {
  if (e.target.id === "q") { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
view.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "catSel") { UI.filter = el.value ? "c:" + el.value : "all"; render(); }
  if (el.id === "startDay") { S.startDay = +el.value; save(); UI.period = null; render(); toast(`Expected pay day set to the ${ord(S.startDay)}.`); }
  if (el.id === "salSel") setSalary(el.value);
  if (el.dataset.earn !== undefined) { const i = +el.dataset.earn, f = el.dataset.f, e = S.earners[i];
    e[f] = el.type === "checkbox" ? el.checked : f === "inclSuper" ? el.value === "1" : ["name","freq","key"].includes(f) ? el.value : (el.value === "" ? "" : +el.value);
    if (f === "key" && i === 0) { if (el.value) { const c = salaryCandidates().find(c => c.key === el.value); S.salary = {key:el.value, name: c ? c.name : titleCase(el.value), confirmed:true}; } }
    if (f === "key") recategorize(); save(); render(); }
  if (el.dataset.sav !== undefined) { const a = el.dataset.sav; S.accounts[a] = {...(S.accounts[a] || {}), savings: el.checked}; recategorize(); save(); render(); toast(el.checked ? `${a} counts as savings.` : `${a} is an everyday account.`); }
  const bk = el.dataset.bk; if (bk) { const b = bucket(bk), k = el.dataset.k, v = el.value; b[k] = k === "due" ? v : k === "pct" ? (v === "" ? null : +v) : +v; save(); render(); }
});
view.addEventListener("dragover", e => { const d = e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
view.addEventListener("dragleave", e => { e.target.closest(".drop")?.classList.remove("over"); });
view.addEventListener("drop", e => { const d = e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleFile(e.dataTransfer.files[0]); } });

/* ================= boot ================= */
(async () => {
  const saved = await store.get();
  if (saved && saved.txns) {
    S = migrate({...freshState(), ...saved}); rebuildCats();
    S.txns = S.txns.map(t => ({...t, norm:norm(t.desc), key:merchantKey(t.desc)}));
    recategorize(); ensureSalary(); recategorize(); save();
  } else { S = freshState(); rebuildCats(); S.txns = sampleTxns(); S.sample = true; recategorize(); ensureSalary(); recategorize(); save(); }
  render();
  if (S.seenVersion !== APP_VERSION) { if (S.seenVersion) setTimeout(() => toast(`Updated to Cashflo ${APP_VERSION}. See what's new in Settings.`), 600); S.seenVersion = APP_VERSION; save(); }
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai$|claudeusercontent/.test(location.hostname)) {
    navigator.serviceWorker.register("sw.js").then(reg => {
      SWREG = reg;
      reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) { UI.updateReady = w; toast("A new version of Cashflo is ready. Reload to use it."); if (UI.tab === "settings") render(); } }); });
    }).catch(() => {});
  }
})();
</script>
