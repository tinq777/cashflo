<!doctype html>
<html lang="en-AU">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f6f62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cashflo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column ledger app, sticky header with month stepper, fixed bottom tab bar; widens to a 2-col overview on desktop */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#14201c; --muted:#5a6a64; --line:#d8e1de;
  --accent:#0f6f62; --accent-ink:#ffffff; --accent-soft:#d7ece7;
  --good:#2c7d48; --good-soft:#dcefe2; --warn:#a8650f; --warn-soft:#f6e8d2; --bad:#b4332a; --bad-soft:#f6dcd9; --info:#3d5f8a; --info-soft:#dfe7f2;
  --fixed:#6f7f99; --flex:#0f6f62;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 16px rgba(20,32,28,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#162019; --sunk:#111a17; --ink:#e4ece9; --muted:#93a59e; --line:#26342f;
  --accent:#3fbfa5; --accent-ink:#06211b; --accent-soft:#163a33;
  --good:#5cc27f; --good-soft:#173524; --warn:#e2a54a; --warn-soft:#3a2a12; --bad:#ec7b70; --bad-soft:#3d1c19; --info:#8fb2e0; --info-soft:#1c2a3d;
  --fixed:#8d9bb4; --flex:#3fbfa5; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#162019; --sunk:#111a17; --ink:#e4ece9; --muted:#93a59e; --line:#26342f;
  --accent:#3fbfa5; --accent-ink:#06211b; --accent-soft:#163a33;
  --good:#5cc27f; --good-soft:#173524; --warn:#e2a54a; --warn-soft:#3a2a12; --bad:#ec7b70; --bad-soft:#3d1c19; --info:#8fb2e0; --info-soft:#1c2a3d;
  --fixed:#8d9bb4; --flex:#3fbfa5; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.brand svg{flex:none}
.month{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
.month button:hover{background:var(--surface)}
.month button:disabled{opacity:.3;cursor:default}
.month span{min-width:96px;white-space:nowrap;text-align:center;font-weight:600;font-size:.9rem}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.banner b{color:var(--info)}
.banner .grow{flex:1;min-width:200px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1.15fr .85fr}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-num);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* meter */
.meter{height:10px;background:var(--sunk);border-radius:999px;position:relative;overflow:hidden}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)} .meter.good>i{background:var(--good)}
.meter-row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;margin-top:6px;flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

/* insights */
.ins{display:flex;flex-direction:column;gap:0}
.ins-item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.ins-item:first-child{border-top:0;padding-top:0}
.ins-item>.bar{align-self:stretch;border-radius:4px;background:var(--info)}
.ins-item.good>.bar{background:var(--good)} .ins-item.warn>.bar{background:var(--warn)} .ins-item.bad>.bar{background:var(--bad)}
.ins-item b{display:block;font-weight:600}
.ins-item p{margin:2px 0 0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.save{font-family:var(--font-num);font-size:.8rem;color:var(--good);white-space:nowrap}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;font-size:.9rem;background:none;border:0;padding:0;text-align:left;width:100%}
.bar-row .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:4px;background:var(--flex)}
.bar-row .track i.fixed{background:var(--fixed)}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* trend chart */
.trend{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:8px}
.trend .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.trend .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.trend .pair i{width:min(16px,40%);border-radius:3px 3px 0 0;display:block}
.trend .in{background:var(--accent-soft);outline:1px solid var(--accent);outline-offset:-1px}
.trend .out{background:var(--ink);opacity:.75}
.trend .col.sel .out{background:var(--accent);opacity:1}
.trend .m{font-size:.75rem;color:var(--muted)}
.trend .col.sel .m{color:var(--ink);font-weight:600}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .d{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);min-width:0}
.row .amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt.in{color:var(--good)}
.day{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 4px;border-top:1px solid var(--line)}
.day:first-child{border-top:0;padding-top:0}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar>*{min-width:0}
.input,.select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%}
.select{padding-right:8px}
textarea.input{height:120px;padding:10px 12px;font-family:var(--font-num);font-size:.8rem;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.btn{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{height:32px;padding:0 10px;font-size:.85rem}
.btn.link{border:0;background:none;color:var(--accent);padding:0;height:auto}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}

/* recurring */
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .mo{font-family:var(--font-num);text-align:right}
.rec .sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.totals .v{font-family:var(--font-num);font-size:1.15rem}

/* buckets */
.alloc{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk);gap:2px}
.alloc i{display:block;height:100%;min-width:2px}
.alloc-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;margin-top:10px}
.alloc-key span{display:inline-flex;align-items:center;gap:6px}
.alloc-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.buckets{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.buckets{grid-template-columns:1fr 1fr}}
.bk{display:flex;flex-direction:column;gap:10px}
.bk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bk-h .acct{font-size:.8rem;color:var(--muted)}
.bk-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bk-fields .input{height:36px;padding:0 8px}
.bk-fig{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;flex-wrap:wrap}

/* data */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rule{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.rule:first-child{border-top:0}
.rule code{font-family:var(--font-num);font-size:.82rem;background:var(--sunk);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}

.fresh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);padding:0 2px}
.fresh b{color:var(--ink);font-weight:600}
.fresh.stale{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:var(--r)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;height:52px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(15,111,98,.35)}
.fab svg{width:22px;height:22px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:7px 8px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer}
.seg input:checked+span{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--warn);color:#fff;font-size:.65rem;display:grid;place-items:center}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,18,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:999px;font-size:1.1rem;line-height:1}
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.preview table{border-collapse:collapse;width:100%;font-size:.82rem}
.preview th,.preview td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.preview th{border-top:0;background:var(--sunk);font-weight:600}
.preview td.num{text-align:right}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.sheet-panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M6 20c4 0 5-8 10-8s6 8 10 8" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="12" r="2.2" fill="var(--accent-ink)"/></svg>
    Cashflo
  </div>
  <div class="month" id="month"><button id="mPrev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="mLabel">—</span><button id="mNext" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs">
  <button class="tab" data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</button>
  <button class="tab" data-tab="txns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Spending<span class="dot" id="uncDot" hidden></span></button>
  <button class="tab" data-tab="recurring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 21v-5h-5"/></svg>Bills</button>
  <button class="tab" data-tab="buckets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg>Buckets</button>
  <button class="tab" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 18v2h16v-2"/></svg>Import</button>
</div></nav>

<button class="fab" id="fab" hidden aria-label="Log a cash spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Cash</button>
<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileIn" accept=".csv,text/csv" hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F0 = new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0});

function applyRules(t, rs){

function recategorize(){
  const rs = rules(); for (const t of S.txns) applyRules(t, rs);
  // pair equal-and-opposite amounts across accounts within 3 days as transfers
  const open = S.txns.filter(t => t.src === "default");
  const byAmt = new Map(); for (const t of open) { const k = Math.abs(t.amount).toFixed(2); (byAmt.get(k) || byAmt.set(k, []).get(k)).push(t); }
  for (const list of byAmt.values()) for (const a of list) for (const b of list)
    if (a !== b && a.acct !== b.acct && a.amount === -b.amount && Math.abs(dayNum(a.date)-dayNum(b.date)) <= 3 && a.src==="default" && b.src==="default") { a.cat = b.cat = "transfer"; a.src = b.src = "auto"; }

const monthsWithData = () => [...new Set(S.txns.map(t => periodOf(t.date)))].sort();
function monthStats(m){
  const r = {income:0, spend:0, fixed:0, flex:0, byCat:{}, byGroup:{}, fixedGroup:{}, cashOut:0, cashLogged:0, cashLoggedSplurge:0};
  for (const t of S.txns) {
    if (periodOf(t.date) !== m) continue;
    const c = cat(t.cat); if (c.type === "transfer") continue;
    if (c.type === "income") { r.income += t.amount; continue; }
    const v = -t.amount; r.spend += v;
    r.byCat[c.id] = (r.byCat[c.id]||0) + v; r.byGroup[c.group] = (r.byGroup[c.group]||0) + v;
    if (c.type === "fixed") { r.fixed += v; r.fixedGroup[c.group] = (r.fixedGroup[c.group]||0) + v; } else r.flex += v;
    if (t.cash) { r.cashLogged += v; if (c.id === "splurge") r.cashLoggedSplurge += v; }
    if (c.id === "cash") r.cashOut += v;
  }
  // cash withdrawals count as spending when taken out; logged cash spends then break that amount down instead of adding to it
  const off = Math.min(r.cashLogged, r.cashOut);
  if (off > 0) { r.byCat.cash -= off; r.byGroup[CAT.cash.group] -= off; r.spend -= off; r.flex -= off; if (r.byCat.cash < 0.005) delete r.byCat.cash; }
  r.cashTotal = Math.max(r.cashOut, r.cashLogged);
  return r;
}
const refMonths = (m, n) => monthsWithData().filter(x => x < m).slice(-n);
function baseMonths(){ const all = monthsWithData(), cur = curPeriod(); const full = all.filter(m => m < cur); return (full.length ? full : all).slice(-3); }
const avgOf = key => { const ms = baseMonths(); return ms.length ? mean(ms.map(m => monthStats(m)[key])) : 0; };
const avgIncome = () => avgOf("income");
const avgSpend = () => avgOf("spend");
const bucket = id => S.buckets.find(b => b.id === id);
const monthsUntil = due => Math.max(1, (dayNum(due) - dayNum(todayISO())) / 30.44);
function goalTarget(b, spend){ return b.goalType === "months" ? (b.months||3) * spend : (+b.target || 0); }
function goalNeed(b, spend){
  if (b.kind !== "goal") return null;
  const left = Math.max(0, goalTarget(b, spend) - (+b.balance || 0));
  return b.goalType === "months" ? left / 12 : left / monthsUntil(b.due || addDays(todayISO(), 365));
}
const hasPct = b => b.pct !== null && b.pct !== "" && !isNaN(+b.pct);
function allocation(){
  const inc = avgIncome(), spend = avgSpend(); let used = 0;
  const rows = S.buckets.map(b => { const need = goalNeed(b, spend); const monthly = hasPct(b) ? inc * b.pct / 100 : (need || 0); used += monthly; return {b, monthly, need}; });
  return {inc, spend, rows, used, unallocated: inc - used};

const FREQS = [
  {id:"weekly", label:"Weekly", days:7, min:5, max:9},
  {id:"fortnightly", label:"Fortnightly", days:14, min:11, max:17},
  {id:"monthly", label:"Monthly", days:30.44, min:25, max:36},

function detectRecurring(){
  const groups = {};
  for (const t of S.txns) { if (t.amount >= 0 || t.cash) continue; const c = cat(t.cat); if (c.type === "transfer" || c.type === "income" || c.id === "cash") continue; (groups[t.key] ||= []).push(t); }
  const out = [], today = dayNum(todayISO());
  for (const [key, list] of Object.entries(groups)) {
    if (S.hiddenRecurring.includes(key) || list.length < 2) continue;
    list.sort((a,b) => a.date < b.date ? -1 : 1);
    const ints = []; for (let i = 1; i < list.length; i++) { const d = dayNum(list[i].date) - dayNum(list[i-1].date); if (d > 0) ints.push(d); }
    if (!ints.length) continue;
    const mi = median(ints), f = FREQS.find(f => mi >= f.min && mi <= f.max); if (!f) continue;
    if (list.length < (f.days <= 31 ? 3 : 2)) continue;
    if (ints.filter(d => Math.abs(d - mi) > Math.max(3, mi*0.35)).length / ints.length > 0.34) continue;
    const amts = list.map(t => -t.amount); if (stdev(amts) / mean(amts) > 0.2) continue;
    const last = list.at(-1), lastAmt = -last.amount, prev = amts.slice(0,-1), prevAmt = median(prev);
    const rise = (lastAmt - prevAmt) / prevAmt;
    const next = addDays(last.date, Math.round(f.days));
    out.push({ key, name: titleCase(key), cat: cat(last.cat), freq: f, count: list.length, lastAmt, lastDate: last.date, prevAmt,
      monthly: lastAmt * 365.25 / f.days / 12, next, overdue: today > dayNum(next) + Math.max(5, f.days*0.5),
      rise: rise >= 0.08 && lastAmt - prevAmt >= 2 ? rise : 0 });
  }
  return out.sort((a,b) => b.monthly - a.monthly);
}

    const partial = m === curPeriod(), scale = partial ? periodDays(m) / Math.max(1, dayNum(todayISO()) - dayNum(periodStart(m)) + 1) : 1;
    for (const [k,v] of Object.entries(st.byCat)) {

      if (partial && dayNum(todayISO()) - dayNum(periodStart(m)) < 6) continue;
      const b = base[k] || 0, proj = v * scale;

    }
  }
  for (const r of rec.filter(r => r.overdue)) L.push({lv:"info", t:`${r.name} hasn't charged since ${fmtDate(r.lastDate)}`, b:"If you cancelled it, great. If not, check it's still running.", go:"recurring", btn:"See bills"});

  const ord = {bad:0, warn:1, good:2, info:3};

}

function parseCSV(text){
  text = text.replace(/^﻿/, ""); const delim = (text.split("\n")[0].match(/;/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function parseDate(s){

const BK_COLORS = ["var(--accent)","#6f7f99","#c58b2a","#4f86c6","#8a6bbf","#3f9b6e","#c4645a","#7a8c3a"];
function vBuckets(){
  const al = allocation(), inc = al.inc, m = UI.month, st = monthStats(m);
  if (!inc) return `<div class="card empty"><h3>Buckets need some income first</h3><p>Import a few months of transactions with your salary so Cashflo can size each bucket.</p><button class="btn primary" data-act="import">Import CSV</button></div>`;
  const segs = al.rows.map((r, i) => ({name:r.b.name, v:r.monthly, c:BK_COLORS[i % BK_COLORS.length]}));
  const over = al.unallocated < 0, scale = Math.max(inc, al.used);
  const cards = al.rows.map((r, i) => {
    const b = r.b; let fig = "", status = "", meter = "";
    if (b.kind === "spend") {
      const actual = b.cat === "splurge" ? st.cashTotal + (st.byCat.splurge || 0) - st.cashLoggedSplurge : b.cat ? (st.byCat[b.cat] || 0) : st.spend, ratio = r.monthly ? actual / r.monthly : 0, cls = ratio <= 0.95 ? "good" : ratio <= 1.05 ? "warn" : "bad";
      status = `<span class="pill ${cls}">${cls === "good" ? "Under" : cls === "warn" ? "On target" : "Over"}</span>`;
      meter = `<div class="meter ${cls}"><i style="width:${Math.min(100, ratio*100).toFixed(1)}%"></i></div>`;

    } else if (b.kind === "goal") {
      const tgt = goalTarget(b, al.spend), bal = +b.balance || 0, pct = tgt ? Math.min(1, bal / tgt) : 0, need = r.need || 0;
      const short = hasPct(b) ? need - r.monthly : 0;
      status = bal >= tgt && tgt ? `<span class="pill good">Reached</span>` : short > 1 ? `<span class="pill bad">Short ${money(short)}/mo</span>` : `<span class="pill good">On track</span>`;
      meter = `<div class="meter good"><i style="width:${(pct*100).toFixed(1)}%"></i></div>`;
      fig = `<div class="bk-fig"><span class="num">${money(bal)} of ${money(tgt)}</span><span class="muted num">needs ${money(need)}/mo${b.goalType === "months" ? " to fill in 12 mo" : ""}</span></div>`
        + (hasPct(b) ? `<div class="bk-fig"><span class="muted">${b.pct}% of income puts in</span><span class="num">${money(r.monthly)}/mo</span></div>` : "");
      if (b.id === "rainy" && bal >= tgt && tgt) fig += `<p class="small muted" style="margin:0">Full. Redirect this ${b.pct}% to Savings or a goal.</p>`;
    } else {
      fig = `<div class="bk-fig"><span class="muted">Puts away</span><span class="num">${money(r.monthly)}/mo · ${money(r.monthly*12)}/yr</span></div>`;
    }

    const goalFields = b.kind !== "goal" ? "" : b.goalType === "months"
      ? `<label class="field"><span>Months of spending</span><input class="input num" type="number" min="1" step="1" data-bk="${b.id}" data-k="months" value="${b.months}"></label><label class="field"><span>Balance now</span><input class="input num" type="number" min="0" step="100" data-bk="${b.id}" data-k="balance" value="${b.balance || 0}"></label>`

    return `<div class="card bk"><div class="bk-h"><div><h3><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${BK_COLORS[i % BK_COLORS.length]};margin-right:8px"></span>${esc(b.name)}</h3><div class="acct">${esc(b.acct || "—")}</div></div>${status}</div>${meter}${fig}<div class="bk-fields">${pctField}${goalFields}</div></div>`;

  if (t.cash) { $("#eRule").checked = false; $("#eRule").closest(".chk").hidden = true; $("#eDel").onclick = () => { S.txns = S.txns.filter(x => x !== t); save(); closeSheet(); render(); toast("Cash spend deleted."); }; }

let pending = null;
async function handleFile(file){
  if (!file) return;
  if (/\.pdf$/i.test(file.name)) { toast("PDF statements arrive in v2. Export a CSV from internet banking for now."); return; }
  let rows; try { rows = parseCSV(await file.text()); } catch { toast("Couldn't read that file. Is it a CSV?"); return; }
  if (!rows.length) { toast("That file is empty."); return; }
  const sig = `${rows[0].length}|` + (detectMapping(rows).hasHeader ? rows[0].join("|") : "nohdr");
  const saved = S.mappings[sig];
  pending = {name:file.name, rows, sig, map: saved ? {...saved.map} : detectMapping(rows), acct: saved?.acct || (/anz/i.test(file.name) ? "ANZ Everyday" : "")};
  openImport();
}
function openImport(){
  const p = pending, m = p.map, cols = Math.max(...p.rows.slice(0, 20).map(r => r.length));
  const colOpts = sel => `<option value="-1">—</option>` + Array.from({length: cols}, (_, i) => `<option value="${i}" ${+sel === i ? "selected" : ""}>Column ${i+1}${m.hasHeader && p.rows[0][i] ? `: ${esc(p.rows[0][i].slice(0,18))}` : ""}</option>`).join("");
  const accts = [...new Set([...S.txns.filter(t => !t.sample).map(t => t.acct), ...Object.values(S.mappings).map(x => x.acct)])];
  const parsed = buildRows(p, 6);
  const ok = buildRows(p).filter(r => r.ok).length, total = p.rows.length - (m.hasHeader ? 1 : 0);
  openSheet(`<div class="sheet-h"><h2>Import ${esc(p.name)}</h2><button class="x" data-close aria-label="Close">×</button></div>
    <label class="field"><span>Which account is this?</span><input class="input" id="iAcct" list="acctList" value="${esc(p.acct)}" placeholder="e.g. ANZ Everyday, ANZ Visa"><datalist id="acctList">${accts.map(a => `<option value="${esc(a)}">`).join("")}</datalist></label>
    <div class="map-grid">
      <label class="field"><span>Date</span><select class="select" data-m="date">${colOpts(m.date)}</select></label>
      <label class="field"><span>Description</span><select class="select" data-m="desc">${colOpts(m.desc)}</select></label>
      <label class="field"><span>Amount (+/−)</span><select class="select" data-m="amount">${colOpts(m.amount)}</select></label>
      <label class="field"><span>First row is headings</span><select class="select" data-m="hasHeader"><option value="1" ${m.hasHeader ? "selected" : ""}>Yes</option><option value="0" ${!m.hasHeader ? "selected" : ""}>No</option></select></label>
      <label class="field"><span>Or: money out column</span><select class="select" data-m="debit">${colOpts(m.debit)}</select></label>
      <label class="field"><span>and money in column</span><select class="select" data-m="credit">${colOpts(m.credit)}</select></label>
    </div>
    <label class="chk"><input type="checkbox" data-m="flip" ${m.flip ? "checked" : ""}><span>Purchases show as positive numbers (common on credit card exports)</span></label>
    <div class="preview"><table><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>${parsed.map(r => `<tr><td>${r.date ? fmtDateY(r.date) : `<span class="neg">?</span>`}</td><td>${esc((r.desc||"").slice(0,40)) || `<span class="neg">?</span>`}</td><td class="num ${r.amount > 0 ? "pos" : ""}">${r.amount === null || isNaN(r.amount) ? `<span class="neg">?</span>` : money(r.amount, true)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted" style="margin:0">${ok} of ${total} rows read cleanly. Money out should show as negative.</p>
    ${S.sample ? `<label class="chk"><input type="checkbox" id="iClearSample" checked><span>Remove the sample data first</span></label>` : ""}
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="iGo" ${ok ? "" : "disabled"}>Import ${ok} transactions</button></div>`);
  panel.querySelectorAll("[data-m]").forEach(el => el.addEventListener("change", () => {
    const k = el.dataset.m; pending.acct = $("#iAcct").value;
    pending.map[k] = el.type === "checkbox" ? el.checked : k === "hasHeader" ? el.value === "1" : +el.value;
    if (k === "amount" && +el.value >= 0) pending.map.debit = pending.map.credit = -1;
    if ((k === "debit" || k === "credit") && +el.value >= 0) pending.map.amount = -1;
    openImport();
  }));
  $("#iGo").onclick = () => runImport($("#iAcct").value.trim() || "My account", $("#iClearSample")?.checked);
}
function buildRows(p, limit){
  const m = p.map, out = [];
  for (let i = m.hasHeader ? 1 : 0; i < p.rows.length && (!limit || out.length < limit); i++) {
    const r = p.rows[i], date = m.date >= 0 ? parseDate(r[m.date]) : null, desc = m.desc >= 0 ? (r[m.desc] || "").trim() : "";
    let amount = null;
    if (m.amount >= 0) amount = parseAmount(r[m.amount]);
    else if (m.debit >= 0 || m.credit >= 0) { const d = parseAmount(r[m.debit]), c = parseAmount(r[m.credit]); if (d !== null || c !== null) amount = Math.abs(c || 0) - Math.abs(d || 0); }
    if (amount !== null && m.flip) amount = -amount;
    out.push({date, desc, amount, ok: !!date && !!desc && amount !== null && !isNaN(amount)});
  }
  return out;
}
function runImport(acct, clearSample){
  if (clearSample) { S.txns = S.txns.filter(t => !t.sample); S.sample = false; }
  const have = new Set(S.txns.map(t => t.id)), counts = {}; let added = 0, dup = 0, bad = 0;
  for (const r of buildRows(pending)) {
    if (!r.ok) { bad++; continue; }
    const base = `${acct}|${r.date}|${r.amount.toFixed(2)}|${norm(r.desc)}`; counts[base] = (counts[base]||0) + 1;
    const id = base + "|" + counts[base]; if (have.has(id)) { dup++; continue; }
    have.add(id); S.txns.push(makeTxn({id, acct, date:r.date, amount:r.amount, desc:r.desc})); added++;
  }
  S.mappings[pending.sig] = {map: pending.map, acct}; S.lastImport = Date.now();
  recategorize(); save(); closeSheet();
  UI.month = null; UI.tab = "overview"; render();
  toast(`Imported ${added}${dup ? `, skipped ${dup} already here` : ""}${bad ? `, ${bad} unreadable` : ""}.`);
}

function restore(text){
  let d; try { d = JSON.parse(text); } catch { toast("That isn't a Cashflo backup."); return; }
  if (d.app !== "cashflo" || !Array.isArray(d.txns)) { toast("That isn't a Cashflo backup."); return; }
  S = {...freshState(), ...d, txns: d.txns.map(t => ({...t, norm:norm(t.desc), key:merchantKey(t.desc)}))};
  recategorize(); save(); closeSheet(); UI.month = null; UI.tab = "overview"; render(); toast(`Restored ${S.txns.length} transactions.`);
}
function freshState(){ return {v:2, txns:[], userRules:[], buckets:DEFAULT_BUCKETS(), hiddenRecurring:[], mappings:{}, sample:false, startDay:15}; }

$("#mPrev").onclick = () => { const ms = monthsWithData(), i = ms.indexOf(UI.month); if (i > 0) { UI.month = ms[i-1]; render(); } };
$("#mNext").onclick = () => { const ms = monthsWithData(), i = ms.indexOf(UI.month); if (i < ms.length-1) { UI.month = ms[i+1]; render(); } };
$("#fileIn").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };
$("#restoreIn").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) restore(await f.text()); };

view.addEventListener("click", async e => {
  const go = e.target.closest("[data-go]"); if (go) { if (go.dataset.filter) UI.filter = go.dataset.filter; else if (go.dataset.go === "txns") UI.filter = "all"; UI.q = ""; setTab(go.dataset.go); return; }
  const tx = e.target.closest("[data-txn]"); if (tx) { openTxn(tx.dataset.txn); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "import") $("#fileIn").click();
  if (act === "quickAdd") quickAdd();
  if (act === "loadSample") { S.txns = [...S.txns.filter(t => !t.sample), ...sampleTxns()]; S.sample = true; recategorize(); save(); UI.month = null; UI.tab = "overview"; render(); }
  if (act === "clearSample") { S.txns = S.txns.filter(t => !t.sample); S.sample = false; save(); UI.month = null; render(); toast("Sample data removed."); }
  if (act === "hideRec") { S.hiddenRecurring.push(a.dataset.key); save(); render(); toast("Hidden from bills."); }
  if (act === "unhideRec") { S.hiddenRecurring = []; save(); render(); }
  if (act === "catKey") { const t = S.txns.filter(x => x.key === a.dataset.key).at(-1); if (t) openTxn(t.id); }
  if (act === "delRule") { S.userRules.splice(+a.dataset.i, 1); recategorize(); save(); render(); toast("Rule deleted."); }
  if (act === "delAcct") confirmSheet(`Remove ${a.dataset.acct}?`, "This deletes its transactions from Cashflo. Your rules and buckets stay.", "Remove", () => { S.txns = S.txns.filter(t => t.acct !== a.dataset.acct); if (!S.txns.some(t => t.sample)) S.sample = false; save(); UI.month = null; render(); }, true);
  if (act === "reset") confirmSheet("Delete everything?", "All transactions, rules and bucket settings are removed from this device. Download a backup first if you might want them.", "Delete everything", () => { S = freshState(); save(); UI.month = null; render(); toast("Cashflo has been reset."); }, true);
  if (act === "exportDl") { try { const url = URL.createObjectURL(new Blob([backupJSON()], {type:"application/json"})); const l = document.createElement("a"); l.href = url; l.download = `cashflo-backup-${todayISO()}.json`; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Backup downloaded. If nothing saved, use Copy backup."); } catch { toast("Download isn't available here. Use Copy backup."); } }
  if (act === "exportCopy") { const txt = backupJSON(); try { await navigator.clipboard.writeText(txt); toast("Backup copied. Paste it into a note or file to keep it."); } catch { openSheet(`<div class="sheet-h"><h2>Your backup</h2><button class="x" data-close aria-label="Close">×</button></div><p class="small muted" style="margin:0">Select all and copy this text somewhere safe.</p><textarea class="input" id="bkTxt" readonly>${esc(txt)}</textarea>`); $("#bkTxt").select(); } }
  if (act === "restoreFile") $("#restoreIn").click();
  if (act === "restorePaste") { openSheet(`<div class="sheet-h"><h2>Restore from text</h2><button class="x" data-close aria-label="Close">×</button></div><p class="small muted" style="margin:0">Paste a Cashflo backup. This replaces what's here now.</p><textarea class="input" id="rsTxt"></textarea><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rsGo">Restore</button></div>`); $("#rsGo").onclick = () => restore($("#rsTxt").value); }
});
view.addEventListener("input", e => {
  if (e.target.id === "q") { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
});
view.addEventListener("change", e => {
  if (e.target.id === "filter") { UI.filter = e.target.value; render(); }
  if (e.target.id === "startDay") { S.startDay = +e.target.value; save(); UI.month = null; render(); toast(startDay() === 1 ? "Using calendar months." : `Budget months now start on the ${ord(S.startDay)}.`); }
  const bk = e.target.dataset.bk; if (bk) { const b = bucket(bk), k = e.target.dataset.k, v = e.target.value; b[k] = k === "due" ? v : k === "pct" ? (v === "" ? null : +v) : +v; save(); render(); }
});
view.addEventListener("dragover", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
view.addEventListener("dragleave", e => { e.target.closest("#drop")?.classList.remove("over"); });
view.addEventListener("drop", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleFile(e.dataTransfer.files[0]); } });

/* ---------- boot ---------- */
(async () => {
  const saved = await store.get();
  if (saved && saved.txns) {
    S = {...freshState(), ...saved};
    S.txns = S.txns.map(t => ({...t, norm:norm(t.desc), key:merchantKey(t.desc)}));
    const ids = new Set(S.buckets.map(b => b.id)); for (const b of DEFAULT_BUCKETS()) if (!ids.has(b.id)) S.buckets.push(b);
    if ((S.v || 1) < 2) { const sp = S.buckets.find(b => b.id === "splurge"); if (sp && +sp.pct === 5) sp.pct = 10; S.v = 2; save(); }
    recategorize();
  } else { S = freshState(); S.txns = sampleTxns(); S.sample = true; recategorize(); save(); }
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai$|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>

</html>
